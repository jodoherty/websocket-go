name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build + vet
        run: go build ./... && go vet ./...
      - name: golangci-lint (all linters, see .golangci.yml)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: staticcheck (every check)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck -checks=all ./...
      - name: tests (race detector)
        run: go test -race ./ws/ ./e2e/
      - name: coverage
        run: |
          go test -coverprofile=cov.out ./ws/
          go tool cover -func=cov.out | tail -1
      - name: branch coverage
        run: |
          go test -covermode=count -coverprofile=bc-unit.out ./ws/
          go test -covermode=count -coverpkg=./ws -coverprofile=bc-e2e.out ./e2e/
          go run ./cmd/branchcov ws bc-unit.out bc-e2e.out
      - name: MC/DC audit
        run: go run ./cmd/mcdc ws
      - name: fuzz (10s)
        run: go test -fuzz=FuzzReadFrame -fuzztime=10s ./ws/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: playwright browsers
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps firefox chromium
      - name: go e2e (mTLS + cross-implementation interop)
        run: go test -race ./e2e/
      - name: playwright (firefox + chromium)
        working-directory: e2e
        run: npx playwright test
